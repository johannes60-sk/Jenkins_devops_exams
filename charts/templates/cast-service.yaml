apiVersion: apps/v1
kind: Deployment
metadata:
  name: cast-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cast-service
  template:
    metadata:
      labels:
        app: cast-service
    spec:
      containers:
        - name: cast-service
          image: "{{ .Values.images.cast.repository }}:{{ .Values.images.cast.tag }}"
          imagePullPolicy: {{ .Values.images.cast.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "app.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--loop"
            - "asyncio"
          env:
            - name: DATABASE_URI
              value: "postgresql://{{ .Values.databases.cast.user }}:{{ .Values.databases.cast.password }}@cast-db/{{ .Values.databases.cast.name }}"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/casts/docs
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cast-service
spec:
  type: ClusterIP
  selector:
    app: cast-service
  ports:
    - port: 8000
      targetPort: 8000