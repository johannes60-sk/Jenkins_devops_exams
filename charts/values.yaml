replicaCount: 1

images:
  movie:
    repository: johannes60/jenkins-movie-service
    tag: latest
    pullPolicy: Always
  cast:
    repository: johannes60/jenkins-cast-service
    tag: latest
    pullPolicy: Always
  nginx:
    repository: nginx
    tag: latest
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: 12.1-alpine
    pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 8080

databases:
  movie:
    user: movie_db_username
    password: movie_db_password
    name: movie_db_dev
  cast:
    user: cast_db_username
    password: cast_db_password
    name: cast_db_dev

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []