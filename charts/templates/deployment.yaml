apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
    spec:
      containers:
        - name: movie-service
          image: "{{ .Values.images.movie.repository }}:{{ .Values.images.movie.tag }}"
          imagePullPolicy: {{ .Values.images.movie.pullPolicy }}
          command: ["uvicorn"]
          args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000", "--loop", "asyncio"]
          env:
            - name: DATABASE_URI
              value: "postgresql://{{ .Values.databases.movie.user }}:{{ .Values.databases.movie.password }}@movie-db/{{ .Values.databases.movie.name }}"
            - name: CAST_SERVICE_HOST_URL
              value: "http://cast-service:8000/api/v1/casts/"
          ports:
            - containerPort: 8000
                    readinessProbe:
          httpGet:
            path: /api/v1/movies/docs
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 30