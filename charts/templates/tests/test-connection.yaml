apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: test-api
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - >
          wget -qO- http://nginx:8080/api/v1/movies/docs > /dev/null &&
          wget -qO- http://nginx:8080/api/v1/casts/docs > /dev/null